[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scbe-aethermoore"
version = "4.3.1"
description = "Hyperbolic Geometry AI Safety Framework with 14-Layer Architecture"
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE", "LICENSE-APACHE"]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "jsonschema>=4.0",
    # security floor: exclude the pydantic-settings symlink-traversal advisory (Dependabot #308; first
    # patched 2.14.2). Transitive today and already pinned in requirements-lock.txt, but constrained here
    # so the manifest itself can never resolve the vulnerable range.
    "pydantic-settings>=2.14.2",
    # Security floors, same reasoning, added 2026-08-05. All of these are
    # TRANSITIVE -- none is imported directly by this package -- but Dependabot
    # resolves pyproject.toml and reported 24 open pip alerts against it, every
    # one of them here. requirements.txt already floors most of them; a
    # requirements file does not constrain what `pip install scbe-aethermoore`
    # resolves, so the floor has to live in the manifest too.
    #
    # Floors, not pins: >= lets a consumer take anything newer and keeps this
    # from fighting their solver. Each is the FIRST PATCHED version from the
    # advisory, so nothing below is reachable.
    "pillow>=12.3.0",           # 13 alerts: OOB read/write + decompression-bomb bypass
    "aiohttp>=3.14.3",          # 6 alerts, high+medium
    "cryptography>=50.0.0",     # vulnerable range is >=44.0.0,<50.0.0 -- see note below
    "pyasn1>=0.6.4",            # 3 alerts, high
    "soupsieve>=2.8.4",         # 2 alerts: selector-parser ReDoS + memory exhaustion
    "mcp>=1.28.1",              # 1 alert, high
    "bedrock-agentcore>=1.18.1",  # argument-delimiter injection in install_packages()
]
authors = [
    {name = "Issac Daniel Davis", email = "issdandavis@users.noreply.github.com"},
]
keywords = [
    "cryptography",
    "security",
    "hyperbolic-geometry",
    "poincare-ball",
    "ai-safety",
    "governance",
    "quantum-resistant",
    "14-layer-architecture",
    "harmonic-scaling",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security :: Cryptography",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
# Model-grade second-tier injection detector (python/scbe/intent_model.py).
# Opt-in -- the default gate stays pure-python; enable with SCBE_INJECTION_MODEL=1
# after installing this extra.
ml = [
    "transformers>=4.40",
    "torch>=2.2",
    "sentencepiece>=0.2",
]
# No-torch CPU path via a pre-exported ONNX model:
ml-onnx = [
    "optimum[onnxruntime]>=1.20",
    "transformers>=4.40",
]

[project.urls]
Homepage = "https://github.com/issdandavis/SCBE-AETHERMOORE"
Repository = "https://github.com/issdandavis/SCBE-AETHERMOORE"
Issues = "https://github.com/issdandavis/SCBE-AETHERMOORE/issues"
Sponsor = "https://github.com/sponsors/issdandavis"
Funding = "https://ko-fi.com/izdandavis"
Supporter = "https://aethermoore.com/SCBE-AETHERMOORE/supporter.html"

[project.scripts]
scbe = "scbe:main"
scbe-scan = "scbe_aethermoore.__main__:main"
# scbe-system removed 2026-07-27: it pointed at scripts/scbe_system_cli.py, a REPO-LOCAL
# dev script that is documented as `python scripts/scbe-system-cli.py` and is excluded from
# packaging (SRC_EXCLUDE contains "scripts*"). The entry point therefore installed a command
# that always died with ModuleNotFoundError. Shipping it is not the fix either: it would put
# a top-level module named `scripts` into site-packages, squatting a name almost any other
# project could also claim. Verified broken on published 4.2.1 and on a clean 4.3.0 wheel.
scbe-convert-to-sft = "symphonic_cipher.scbe_aethermoore.convert_to_sft:main"
scbe-code-prism = "code_prism.cli:main"

# Package discovery is in setup.py — the mixed layout (src/ packages PLUS the
# python/scbe engine imported as python.scbe) needs two find_packages calls, which a
# single static packages.find can't express without name-colliding on the duplicate
# root packages (symphonic_cipher/, api/).
