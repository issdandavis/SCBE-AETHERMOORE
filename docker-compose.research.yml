services:
  hydra-research-api:
    build:
      context: .
      dockerfile: Dockerfile.research
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - "SCBE_API_KEY=${SCBE_API_KEY:?Set SCBE_API_KEY to a strong secret before starting the research stack}"
    volumes:
      - hydra_data:/app/artifacts/hydra
    restart: unless-stopped

  hydra-research-worker-1:
    build:
      context: .
      dockerfile: Dockerfile.research
    command: >
      python -m hydra.research_worker
      --db /app/artifacts/hydra/switchboard.db
      --roles researcher
      --worker-id researcher-1
      --backend playwright
      --poll-sec 1.0
    volumes:
      - hydra_data:/app/artifacts/hydra
    depends_on:
      - hydra-research-api
    restart: unless-stopped

  hydra-research-worker-2:
