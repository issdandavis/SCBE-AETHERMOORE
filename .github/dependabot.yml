# Dependabot configuration for SCBE-AETHERMOORE
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# This is a monorepo: ~25 Python manifests and ~15 npm lockfiles live in nested
# sub-apps (packages/*, apps/*, game/*, conference-app, examples/*, ...). The old
# config used singular `directory: "/"` (root only), so nested lockfiles were
# never watched and their advisories just sat open. `directories: ["/**"]`
# watches every manifest recursively; `groups` batches the bumps so we get a few
# PRs per ecosystem, not dozens. Vendored / archived lanes are excluded with the
# supported `exclude-paths` option.
version: 2
updates:
  # ── Python (every manifest, recursively) ──────────────────────────────────
  - package-ecosystem: "pip"
    directories:
      - "/**"
    exclude-paths:
      - "archive/**"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    groups:
      pip-security:
        applies-to: security-updates
        patterns:
          - "*"
      pip-version:
        applies-to: version-updates
        patterns:
          - "*"

  # ── npm (every manifest, recursively, minus vendored / submodule lanes) ───
  - package-ecosystem: "npm"
    directories:
      - "/**"
    exclude-paths:
      - "external/**"
      - "external_repos/**"
      - "archive/**"
      - "spiralverse-protocol/**"
      - "aws-lambda-simple-web-app/**"
      - "hioujhn/**"
      - "scbe-aethermoore/**"
      - "packages/six-tongues-geoseal/**"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    # v10 currently pulls image-size 2.0.2, whose ICNS/JXL/HEIF infinite-loop
    # advisories have no patched release. Keep the tested v9 API until Netlify
    # ships a dependency line that no longer contains that vulnerable parser.
    ignore:
      - dependency-name: "@netlify/blobs"
        versions:
          - ">=9.1.6 <10.0.0"
        update-types:
          - "version-update:semver-major"
      # TypeScript 7 removes moduleResolution=node10. Keep compatible 6.x
      # updates flowing until the repository's module-resolution migration.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
      npm-version:
        applies-to: version-updates
        patterns:
          - "*"

  # ── Dev containers ────────────────────────────────────────────────────────
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"
