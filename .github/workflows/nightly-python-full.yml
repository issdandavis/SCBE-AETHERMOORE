name: Nightly Full Python Suite

# The PR-gated lane (scripts/system/run_core_python_checks.py) runs a fast
# smoke subset; this nightly run executes the ENTIRE pytest suite so broken
# tests can't sit invisible on main. Mirrors the documented local command in
# CLAUDE.md ("Pre-Push Verification").

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  full-pytest:
    name: Full pytest (-m "not slow")
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      # Several Python tests shell out to the npm CLIs
      # (packages/cli/bin/scbe.js, api/agent/search.js).
      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # pytest-benchmark 5.3.0 reads a private Pytest field removed in
          # Pytest 9.2. Keep the nightly correctness lane on the proven pair
          # until the plugin publishes a compatible release.
          pip install "pytest>=8,<9.2" "pytest-benchmark>=4,<5.3" pytest-asyncio pytest-cov hypothesis

      - name: Run full suite
        id: full_suite
        env:
          PYTHONPATH: .
        run: |
          set -o pipefail
          python -m pytest tests/ -q \
            --ignore=tests/node_modules \
            --ignore=tests/aetherbrowser/test_integration.py \
            --ignore=tests/aetherbrowser/test_red_zone_integration.py \
            -m "not slow" \
            --continue-on-collection-errors 2>&1 | tee nightly-pytest.log

      - name: Upload nightly failure evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-pytest-log
          path: nightly-pytest.log
          if-no-files-found: ignore
          retention-days: 30

      # A red X on a scheduled run is easy to miss — surface failures as a
      # labeled issue so they land in triage instead of rotting silently.
      - name: Reconcile failure issue
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const { reconcileRollingIssue } = require('./.github/scripts/issue-lifecycle.cjs');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const log = fs.existsSync('nightly-pytest.log')
              ? fs.readFileSync('nightly-pytest.log', 'utf8')
              : '';
            const findings = log
              .split(/\r?\n/)
              .filter((line) => /^(FAILED|ERROR) /.test(line))
              .slice(-25);
            const body = [
              '## Nightly full Python suite failed',
              '',
              `**Latest run:** ${runUrl}`,
              "",
              "The PR smoke lane does not cover these tests, so this failure is",
              "invisible to PR CI — triage before it compounds.",
              ...(findings.length > 0
                ? ['', '### Failure summary', '```text', ...findings, '```']
                : ['', 'The run stopped before a pytest failure summary was produced.']),
              '',
              'The complete log is attached to the workflow run as `nightly-pytest-log`.',
            ].join("\n");
            await reconcileRollingIssue({
              github,
              context,
              key: 'nightly-python',
              label: 'nightly-failure',
              title: 'Nightly full Python suite failed',
              active: true,
              body,
              labels: ['automated', 'action-needed'],
              legacyTitlePrefixes: ['Nightly full Python suite failed'],
            });

      - name: Close resolved failure issue
        if: success()
        uses: actions/github-script@v9
        with:
          script: |
            const { reconcileRollingIssue } = require('./.github/scripts/issue-lifecycle.cjs');
            await reconcileRollingIssue({
              github,
              context,
              key: 'nightly-python',
              label: 'nightly-failure',
              title: 'Nightly full Python suite failed',
              active: false,
              legacyTitlePrefixes: ['Nightly full Python suite failed'],
            });
