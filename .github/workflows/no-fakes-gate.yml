name: No-New-Fakes Gate
concurrency:
  # One in-flight run per workflow per ref. A newer push supersedes an older run on a
  # branch; on main nothing is cancelled, because interrupting a deploy or publish
  # half-way is worse than letting a duplicate finish.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}


# Fails the build if stub/fake/placeholder code appears in the real product path
# outside scripts/ci/no_fakes_baseline.txt. New fakes cannot land; existing ones
# are ratcheted to zero by deleting baseline lines as they are made real.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  no-fakes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: No-new-fakes gate
        run: python scripts/ci/no_fakes_gate.py
