name: Security Checks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install security tooling
        run: |
          python -m pip install --upgrade pip
          pip install bandit "setuptools>=84.1.0" "pip-audit==2.10.1"

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run bandit
        id: bandit
        # audit: hard gate for high-severity Python issues.
        run: |
          bandit -r src scripts api python agents -q \
            --severity-level high \
            -x tests,node_modules,dist,artifacts,training,external

      - name: Audit every active npm lockfile
        id: npm_audit
        continue-on-error: true
        run: >-
          python scripts/security/npm_audit_all.py
          --audit-level high
          --report npm-audit-report.json

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit-report.json
          if-no-files-found: warn

      - name: Audit every exact Python dependency surface
        id: pip_audit
        continue-on-error: true
        run: >-
          python scripts/security/pip_audit_all.py
          --report pip-audit-report.json

      - name: Upload pip audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit-report.json
          if-no-files-found: warn

      - name: Security summary
        if: always()
        run: |
          echo "## Security Checks" >> "$GITHUB_STEP_SUMMARY"
          echo "- gitleaks: **blocking**" >> "$GITHUB_STEP_SUMMARY"
          echo "- bandit: ${{ steps.bandit.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- npm audit (all lockfiles): ${{ steps.npm_audit.outcome || 'skipped' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- pip-audit (all exact pins): ${{ steps.pip_audit.outcome || 'skipped' }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if blocking security checks failed
        if: always()
        run: |
          failed=0
          if [ "${{ steps.bandit.outcome }}" = "failure" ]; then
            echo "::error::Bandit security scan found issues"
            failed=1
          fi
          if [ "${{ steps.npm_audit.outcome }}" = "failure" ]; then
            echo "::error::npm audit found a high/critical vulnerability or scanner error"
            failed=1
          fi
          if [ "${{ steps.pip_audit.outcome }}" = "failure" ]; then
            echo "::error::pip-audit found a vulnerability or scanner coverage error"
            failed=1
          fi
          if [ "$failed" -eq 1 ]; then
            echo "::error::One or more blocking security checks reported issues — see summary above"
            exit 1
          fi
