name: agent-bus · Lint and Test
concurrency:
  # One in-flight run per workflow per ref. A newer push supersedes an older run on a
  # branch; on main nothing is cancelled, because interrupting a deploy or publish
  # half-way is worse than letting a duplicate finish.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}


on:
  push:
    branches: ["main", "master", "dev"]
    paths:
      - "packages/agent-bus/**"
      - ".github/workflows/agent-bus-*.yml"
  pull_request:
    branches: ["main", "master", "dev"]
    paths:
      - "packages/agent-bus/**"
      - ".github/workflows/agent-bus-*.yml"

defaults:
  run:
    working-directory: packages/agent-bus

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/agent-bus/package-lock.json
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Prettier check
        run: npm run format:check
      - name: Run tests
        run: npm test
