name: build-binaries

# Build the standalone `scbe` CLI as a single self-contained executable for
# Windows / Linux / macOS (no Python install needed) and attach them to the
# GitHub Release on a version tag. Also runnable on demand via workflow_dispatch,
# which uploads the binaries as build artifacts.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: scbe-linux-x64
          - os: windows-latest
            asset: scbe-windows-x64.exe
          # macOS is DELIBERATELY not built. It is not an oversight and not a flake.
          #
          # This repo ships a top-level package named `python` (python/scbe, imported as
          # python.scbe). macOS runners use a CPython Framework build whose shared library
          # is a file named exactly `Python`, and macOS filesystems are case-insensitive by
          # default -- so `python` and `Python` are the same name inside the bundle. That
          # collides at three separate stages, each verified on a real runner:
          #   1. collection  -- "skipping data collection for module 'python.scbe' as it is
          #                     not a package"        (fixed: python/__init__.py + pinned
          #                     build-time sys.path)
          #   2. extraction  -- "[PYI-1903:ERROR] Failed to create parent directory
          #                     structure"            (fixed: data staged under scbe_data/)
          #   3. import      -- "ModuleNotFoundError: No module named 'python.scbe'"
          #                                           (NOT FIXED)
          # A runtime hook seeding sys.modules['python'] was tried for (3) and reverted: it
          # starved the frozen importer and broke the Windows build too.
          #
          # The real fix is renaming that package, which breaks a public import path and
          # belongs in a major version. Until then a macOS job can only ever be red, and a
          # permanently-red job trains everyone to ignore this workflow -- which is exactly
          # how it went unnoticed that build-binaries had NEVER succeeded on any platform.
          # Re-add this entry in the same change that renames the package:
          #   - os: macos-latest
          #     asset: scbe-macos-arm64
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          # Minimal runtime deps the cube CLI needs (numpy for the geometric router,
          # jsonschema for ingestion_rights validators), plus the bundler.
          python -m pip install --require-hashes -r .github/workflows/build-binaries-requirements.txt

      - name: Build binary
        run: pyinstaller scbe.spec

      - name: Smoke test (the cube system must actually run)
        shell: bash
        run: |
          BIN=dist/scbe
          [ -f dist/scbe.exe ] && BIN=dist/scbe.exe
          "$BIN" code "+ sqrt * inc"
          "$BIN" think "+ sqrt *"
          "$BIN" illuminate --gens 2 --batch 40
          "$BIN" fold --fortune "+ * sqrt inc" --pick 4 3 2

      - name: Stage asset
        shell: bash
        run: |
          mkdir -p out
          if [ -f dist/scbe.exe ]; then cp dist/scbe.exe "out/${{ matrix.asset }}"; else cp dist/scbe "out/${{ matrix.asset }}"; fi
          (cd out && sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256")

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.asset }}
          path: |
            out/${{ matrix.asset }}
            out/${{ matrix.asset }}.sha256
          if-no-files-found: error

  publish:
    name: publish release assets
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: out
          merge-multiple: true

      - name: Verify checksums
        run: sha256sum --check out/*.sha256

      - name: Attach to Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: out/*
