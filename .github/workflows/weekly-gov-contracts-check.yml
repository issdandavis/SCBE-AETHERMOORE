name: Weekly Gov Contracts Check

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 6 AM UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  scan-sam-gov:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Query SAM.gov for relevant opportunities
        id: sam_query
        env:
          SAM_GOV_API_KEY: ${{ secrets.SAM_GOV_API_KEY }}
        run: >-
          python scripts/system/scan_sam_opportunities.py
          --days 14
          --per-profile 50
          --min-score 6
          --max-results 100
          --output artifacts/gov-contracts/sam_gov_weekly.json

      - name: Upload SAM.gov report artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sam-gov-weekly-report
          path: artifacts/gov-contracts/sam_gov_weekly.json
          if-no-files-found: warn
          retention-days: 90

      - name: Publish scan summary and reconcile issue
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const { reconcileRollingIssue } = require('./.github/scripts/issue-lifecycle.cjs');
            const today = new Date().toISOString().slice(0, 10);
            const title = 'Government Contracts Scan - action required';

            let reportData = {
              opportunities: [],
              profiles: [],
              query_errors: [],
              total_opportunities: 0,
              successful_profiles: 0,
              profile_count: 0,
              scan_complete: false,
            };
            try {
              reportData = JSON.parse(fs.readFileSync('artifacts/gov-contracts/sam_gov_weekly.json', 'utf8'));
            } catch (e) {
              console.log('Could not read report file:', e.message);
            }

            const total = reportData.total_opportunities || 0;
            const queryErrors = reportData.query_errors || [];
            const profileCount = reportData.profile_count || reportData.profiles?.length || 0;
            const successfulProfiles = reportData.successful_profiles || 0;
            const scanComplete = reportData.scan_complete === true &&
              queryErrors.length === 0 && successfulProfiles === profileCount;
            const cell = (value, max = 70) => String(value || 'N/A')
              .replace(/[\r\n]+/g, ' ')
              .replace(/\|/g, '\\|')
              .slice(0, max);
            let body = `## Weekly Government Contracts Scan\n\n`;
            body += `**Date:** ${today}\n`;
            body += `**Opportunities Found:** ${total}\n\n`;

            if (!scanComplete) {
              body += `### Scan Incomplete\n\n`;
              body += `${queryErrors.length} of ${profileCount} profiles failed; `;
              body += `${successfulProfiles} completed. `;
              body += `A zero result is **UNKNOWN**, not evidence that no opportunities exist.\n\n`;
              for (const error of queryErrors.slice(0, 20)) {
                body += `- ${cell(error.label || error.profile_id)}: ${cell(error.error, 120)}\n`;
              }
              body += `\n`;
            }

            if (total === 0 && scanComplete) {
              body += `No new opportunities matching our search terms were posted this week.\n\n`;
              body += `### Search Profiles\n`;
              for (const profile of (reportData.profiles || [])) {
                body += `- ${cell(profile.label, 100)}\n`;
              }
            } else if (total > 0) {
              body += `### Opportunities\n\n`;
              body += `| Score | Title | Organization | NAICS | Deadline | Match | Link |\n`;
              body += `|------:|-------|--------------|-------|----------|-------|------|\n`;
              for (const opp of (reportData.opportunities || []).slice(0, 30)) {
                const url = String(opp.sam_url || '');
                const link = /^https:\/\/([a-z0-9-]+\.)?sam\.gov\//i.test(url) ? `[View](${url})` : 'N/A';
                const matches = (opp.matched_terms || opp.matched_profiles || []).slice(0, 3).join(', ');
                body += `| ${Number(opp.relevance_score || 0)} | ${cell(opp.title)} | `;
                body += `${cell(opp.organization, 55)} | ${cell(opp.naics_code, 8)} | `;
                body += `${cell(opp.response_deadline, 24)} | ${cell(matches, 45)} | ${link} |\n`;
              }
              if (total > 30) {
                body += `\n*Showing 30 of ${total} results. See full report in workflow artifacts.*\n`;
              }
            }

            body += `\n---\n*Automated by weekly-gov-contracts-check workflow*`;

            await core.summary.addRaw(body).write();
            await reconcileRollingIssue({
              github,
              context,
              key: 'gov-contracts',
              label: 'gov-contracts',
              title,
              body,
              active: total > 0 || !scanComplete,
              labels: ['automated', 'action-needed'],
              legacyTitlePrefixes: ['Gov Contracts Scan -'],
            });

      - name: Enforce complete SAM.gov scan
        if: >-
          always() &&
          (steps.sam_query.outcome != 'success' ||
          steps.sam_query.outputs.errors != '0')
        run: |
          echo "::error::SAM.gov opportunity scan was incomplete; review the workflow summary and rolling issue."
          exit 1
