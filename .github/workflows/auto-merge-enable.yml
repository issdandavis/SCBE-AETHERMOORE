name: Enable Auto-Merge for Trusted PRs

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event.pull_request.draft == false &&
      (github.actor == 'dependabot[bot]' ||
      github.actor == 'copilot-swe-agent' ||
      github.actor == 'issdandavis')
    steps:
      - name: Require an integrity-protected base branch
        id: protection
        shell: bash
        env:
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          encoded_base="$(jq -rn --arg value "$BASE_BRANCH" '$value | @uri')"
          if ! protection="$(
            gh api "repos/$GITHUB_REPOSITORY/branches/$encoded_base/protection" 2>/dev/null
          )"; then
            echo "safe_to_merge=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Base branch $BASE_BRANCH is not protected; leaving the PR open."
            exit 0
          fi

          if jq -e '
            [
              .required_status_checks.contexts[]?,
              .required_status_checks.checks[]?.context
            ] | index("verify-source-manifest") != null
          ' <<< "$protection" >/dev/null; then
            echo "safe_to_merge=true" >> "$GITHUB_OUTPUT"
          else
            echo "safe_to_merge=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Base branch $BASE_BRANCH does not require verify-source-manifest; leaving the PR open."
          fi

      - name: Enable auto-merge (squash)
        if: steps.protection.outputs.safe_to_merge == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rc=0
          out="$(gh pr merge --auto --squash "$PR_URL" 2>&1)" || rc=$?
          echo "$out"
          if [ "$rc" -eq 0 ]; then
            exit 0
          fi
          if echo "$out" | grep -q "Merge already in progress"; then
            echo "Auto-merge already in progress; treating as success."
            exit 0
          fi
          if echo "$out" | grep -q "Base branch was modified"; then
            echo "Base branch changed while enabling auto-merge; treating as neutral."
            exit 0
          fi
          exit "$rc"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
