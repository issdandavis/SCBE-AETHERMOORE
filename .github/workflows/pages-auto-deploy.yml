name: Auto-Deploy GitHub Pages

on:
  push:
    branches: [main, site-publish-v4]
    paths:
      - 'docs/**'
      - 'app/**'
      - 'scripts/system/build_public_github_map.py'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Build AetherMoore app
        run: |
          npm ci --prefix app
          npm run build --prefix app

      - name: Map every page to GitHub
        run: python scripts/system/build_public_github_map.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Print URL
        run: echo "Deployed to ${{ steps.deployment.outputs.page_url }}"
