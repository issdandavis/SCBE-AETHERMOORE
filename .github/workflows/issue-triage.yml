name: Issue Triage

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout trusted triage rules
        uses: actions/checkout@v7

      - name: Apply high-confidence labels
        uses: actions/github-script@v9
        with:
          script: |
            const issue = context.payload.issue;
            const { classifyIssue } = require('./.github/scripts/issue-triage.cjs');
            const labels = classifyIssue({
              title: issue.title,
              labels: issue.labels,
              author: issue.user,
            });

            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: labels
              });
            }
