name: Research Feed
concurrency:
  # One in-flight run per workflow per ref. A newer push supersedes an older run on a
  # branch; on main nothing is cancelled, because interrupting a deploy or publish
  # half-way is worse than letting a duplicate finish.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}


on:
  # Daily at 08:10 UTC = 00:10 Pacific, so a fresh set of articles is already on the site
  # by morning. This is the one nightly job that is RESEARCH rather than a build: it feeds
  # the website banner and the articles page.
  #
  # Offset off the hour on purpose -- GitHub's shared cron runners are heavily contended at
  # :00 and scheduled runs get delayed or dropped there.
  schedule:
    - cron: "10 8 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/research-feed.yml"
      - "scripts/system/generate_research_feed.py"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install requests cryptography --quiet

      - name: Generate research-feed.json
        env:
          SAM_GOV_API_KEY: ${{ secrets.SAM_GOV_API_KEY }}
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
          WORLDNEWS_API_KEY: ${{ secrets.WORLDNEWS_API_KEY }}
        run: python scripts/system/generate_research_feed.py

      - name: Run SCBE news pipeline (geo -> tokenize -> hash -> egg -> encrypt -> sign)
        env:
          SCBE_FORCE_SKIP_LIBOQS: "1"
          PYTHONPATH: "."
        run: python scripts/system/news_pipeline.py

      - name: Create PR for updated feed and pipeline outputs
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          commit_message: "chore(feed): update research-feed.json + pipeline SFT [skip ci]"
          branch: automation/research-feed
          delete-branch: true
          title: "chore(feed): update research feed outputs"
          body: |
            Automated update from the Research Feed workflow.

            This PR refreshes:
            - `docs/research-feed.json`
            - `docs/research-pipeline.json`
            - `training-data/news-pipeline/records/*.jsonl`
            - `training-data/news-pipeline/sft/*.jsonl`
          file_pattern: >
            docs/research-feed.json
            docs/research-pipeline.json
            training-data/news-pipeline/records/*.jsonl
            training-data/news-pipeline/sft/*.jsonl
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com

      # A daily feed that needs a human to click merge is not a daily feed. main requires
      # no approving reviews (only 1 status check) and the repo already has auto-merge
      # enabled, so the PR merges itself once that check goes green -- branch protection
      # stays fully in force, nothing is bypassed.
      #
      # Only for scheduled runs: a push- or dispatch-triggered run is someone testing a
      # change to the generator, and that should stop for a look rather than self-merge.
      - name: Enable auto-merge on the daily feed PR
        if: github.event_name == 'schedule' && steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge --squash --auto "${{ steps.cpr.outputs.pull-request-number }}" \
            || echo "auto-merge not enabled on this PR; it will wait for a manual merge"

