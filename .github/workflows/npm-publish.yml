name: npm-publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v4.0.3). Defaults to latest semver tag.'
        required: true
      dry_run:
        description: 'Build and test without publishing'
        type: boolean
        default: true
      github_packages:
        description: 'Also publish the separate GitHub Packages mirror'
        type: boolean
        default: false

concurrency:
  group: npm-publish-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  npmjs:
    name: Publish to npmjs.org
    if: ${{ inputs.tag != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify package version matches tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          PKG_VER=$(node -p "require('./package.json').version")
          TAG="$RELEASE_TAG"
          TAG_VER="${TAG#v}"
          if [ "$PKG_VER" != "$TAG_VER" ]; then
            echo "::error::package.json version ($PKG_VER) does not match tag ($TAG_VER)"
            exit 1
          fi

      - name: Verify the tarball in a clean consumer
        id: consumer
        run: npm run publish:smoke:consumer -- --root-only

      - name: Publish the tested tarball to npmjs
        if: ${{ !inputs.dry_run }}
        env:
          TARBALL: ${{ steps.consumer.outputs.tarball }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish "$TARBALL" --ignore-scripts --provenance --access public

  github-packages:
    name: Publish to GitHub Packages
    if: ${{ inputs.tag != '' && inputs.github_packages && !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node (GH Packages registry)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@issdandavis'

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Rewrite package name to scoped form for GH Packages
        # GitHub Packages requires a scope matching the owner. We don't change the
        # name on disk in main — only in this transient build artifact.
        run: |
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json','utf8'));
            p.name = '@issdandavis/scbe-aethermoore';
            p.publishConfig = { registry: 'https://npm.pkg.github.com' };
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2));
          "

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
