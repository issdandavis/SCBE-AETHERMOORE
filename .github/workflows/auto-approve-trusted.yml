name: Auto-Approve Trusted PRs

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-approve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event.pull_request.user.login != 'github-actions[bot]' &&
      (github.actor == 'dependabot[bot]' ||
       github.actor == 'copilot-swe-agent' ||
       github.actor == 'issdandavis')
    steps:
      # GITHUB_TOKEN is github-actions[bot]; GitHub rejects self-approval.
      - name: Approve PR
        uses: hmarr/auto-approve-action@v4
        with:
          review-message: "Auto-approved: trusted source (${{ github.actor }})"
