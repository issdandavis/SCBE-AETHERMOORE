name: Weekly Security Scan

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 6 AM UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  security-events: write

jobs:
  secret-scan:
    name: Secret Scan (check_secrets.py)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run secret scanner
        id: secrets
        run: |
          # Advisory telemetry; the report job turns this result into an issue.
          set +e
          python scripts/check_secrets.py --all > secrets-report.txt 2>&1
          EXIT_CODE=$?
          set -e
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: secrets-report
          path: secrets-report.txt
          retention-days: 90
    outputs:
      found: ${{ steps.secrets.outputs.found }}

  npm-audit:
    name: npm Audit (all lockfiles)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit every active npm project
        id: npm_audit
        continue-on-error: true
        run: >-
          python scripts/security/npm_audit_all.py
          --audit-level none
          --report npm-audit-report.json
      - name: Parse aggregate results
        id: npm_result
        if: always()
        run: |
          python3 - <<'PYEOF'
          import json, os
          from pathlib import Path

          report = Path("npm-audit-report.json")
          values = {
              "critical": 0,
              "high": 0,
              "moderate": 0,
              "low": 0,
              "projects": 0,
              "errors": 1,
          }
          if report.exists():
              try:
                  data = json.loads(report.read_text())
                  totals = data.get("totals", {})
                  for severity in ("critical", "high", "moderate", "low"):
                      values[severity] = int(totals.get(severity, 0) or 0)
                  values["projects"] = int(data.get("project_count", 0) or 0)
                  values["errors"] = len(data.get("errors", []))
              except Exception as exc:
                  print(f"::warning::npm aggregate report parse error: {exc}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as stream:
              for key, value in values.items():
                  stream.write(f"{key}={value}\n")
          PYEOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit-report
          path: npm-audit-report.json
          if-no-files-found: warn
          retention-days: 90
    outputs:
      critical: ${{ steps.npm_result.outputs.critical }}
      high: ${{ steps.npm_result.outputs.high }}
      moderate: ${{ steps.npm_result.outputs.moderate }}
      low: ${{ steps.npm_result.outputs.low }}
      projects: ${{ steps.npm_result.outputs.projects }}
      errors: ${{ steps.npm_result.outputs.errors }}

  pip-audit:
    name: pip Audit (all exact pins)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned audit tooling
        run: >-
          python -m pip install --upgrade
          "setuptools>=84.1.0"
          "pip-audit==2.10.1"
      - name: Audit every exact Python dependency surface
        id: pip_audit
        continue-on-error: true
        run: >-
          python scripts/security/pip_audit_all.py
          --report pip-audit-report.json
      - name: Parse aggregate results
        id: pip_result
        if: always()
        run: |
          python3 - <<'PYEOF'
          import json, os
          from pathlib import Path
          report = Path("pip-audit-report.json")
          values = {
              "vuln_packages": 0,
              "vulnerabilities": 0,
              "surfaces": 0,
              "errors": 1,
          }
          if report.exists():
              try:
                  data = json.loads(report.read_text())
                  totals = data.get("totals", {})
                  for key in ("vuln_packages", "vulnerabilities", "surfaces"):
                      values[key] = int(totals.get(key, 0) or 0)
                  values["errors"] = int(totals.get("scanner_errors", 0) or 0)
              except Exception as exc:
                  print(f"::warning::pip aggregate report parse error: {exc}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as stream:
              for key, value in values.items():
                  stream.write(f"{key}={value}\n")
          PYEOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-report
          path: pip-audit-report.json
          retention-days: 90
    outputs:
      vuln_packages: ${{ steps.pip_result.outputs.vuln_packages }}
      vulnerabilities: ${{ steps.pip_result.outputs.vulnerabilities }}
      surfaces: ${{ steps.pip_result.outputs.surfaces }}
      errors: ${{ steps.pip_result.outputs.errors }}

  report:
    name: Create Security Issue
    needs: [secret-scan, npm-audit, pip-audit]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - name: Create or update rolling issue
        uses: actions/github-script@v7
        env:
          SECRETS_FOUND: ${{ needs.secret-scan.outputs.found }}
          NPM_CRITICAL: ${{ needs.npm-audit.outputs.critical }}
          NPM_HIGH: ${{ needs.npm-audit.outputs.high }}
          NPM_MODERATE: ${{ needs.npm-audit.outputs.moderate }}
          NPM_LOW: ${{ needs.npm-audit.outputs.low }}
          NPM_PROJECTS: ${{ needs.npm-audit.outputs.projects }}
          NPM_ERRORS: ${{ needs.npm-audit.outputs.errors }}
          PIP_VULNS: ${{ needs.pip-audit.outputs.vuln_packages }}
          PIP_ADVISORIES: ${{ needs.pip-audit.outputs.vulnerabilities }}
          PIP_SURFACES: ${{ needs.pip-audit.outputs.surfaces }}
          PIP_ERRORS: ${{ needs.pip-audit.outputs.errors }}
        with:
          script: |
            const today = new Date().toISOString().slice(0, 10);
            const title = 'Security Scan - rolling';

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'security-scan',
              state: 'open',
            });
            const rolling = existing.data.find((issue) => issue.title === title);
            for (const issue of existing.data) {
              if (issue.title.startsWith('Security Scan -') && issue.title !== title) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed',
                });
              }
            }

            const count = (name) => parseInt(process.env[name] || '0', 10);
            const leaked = process.env.SECRETS_FOUND === 'true';
            const npmCrit = count('NPM_CRITICAL');
            const npmHigh = count('NPM_HIGH');
            const npmModerate = count('NPM_MODERATE');
            const npmLow = count('NPM_LOW');
            const npmProjects = count('NPM_PROJECTS');
            const npmErrors = count('NPM_ERRORS');
            const pipVulns = count('PIP_VULNS');
            const pipAdvisories = count('PIP_ADVISORIES');
            const pipSurfaces = count('PIP_SURFACES');
            const pipErrors = count('PIP_ERRORS');

            const hasCritical = leaked || npmCrit > 0;
            const hasIssues = hasCritical || npmHigh > 0 || npmModerate > 0 ||
              npmLow > 0 || npmErrors > 0 || pipVulns > 0 || pipErrors > 0;
            const status = hasCritical ? 'CRITICAL' : hasIssues ? 'WARNINGS' : 'CLEAN';

            let body = [
              '## Weekly Security Scan',
              '',
              '**Status:** ' + status,
              '**Date:** ' + today,
              '',
              '| Scanner | Finding | Count |',
              '|---------|---------|------:|',
              '| check_secrets.py | Leaked tokens | ' + (leaked ? 'YES' : 'None') + ' |',
              '| npm audit (' + npmProjects + ' projects) | Critical | ' + npmCrit + ' |',
              '| npm audit (' + npmProjects + ' projects) | High | ' + npmHigh + ' |',
              '| npm audit (' + npmProjects + ' projects) | Moderate | ' + npmModerate + ' |',
              '| npm audit (' + npmProjects + ' projects) | Low | ' + npmLow + ' |',
              '| npm audit | Scanner errors | ' + npmErrors + ' |',
              '| pip-audit (' + pipSurfaces + ' surfaces) | Vulnerable packages | ' + pipVulns + ' |',
              '| pip-audit (' + pipSurfaces + ' surfaces) | Advisories | ' + pipAdvisories + ' |',
              '| pip-audit | Scanner errors | ' + pipErrors + ' |',
              '',
            ].join('\n');

            if (leaked) {
              body += '\n### Secret Leak Detected\nReview the secrets-report artifact immediately.\n';
            }
            if (npmErrors > 0) {
              body += '\n### Scanner Error\nReview the npm-audit-report artifact; one or more projects could not be audited.\n';
            }
            if (npmCrit > 0 || npmHigh > 0) {
              body += '\n### Action Required\nRun `npm run security:audit:npm`, update the affected project, and rerun its tests.\n';
            }
            if (pipVulns > 0) {
              body += '\n### Python Action Required\nRun `python scripts/security/pip_audit_all.py`, update every affected lock surface, and rerun its tests.\n';
            }
            if (pipErrors > 0) {
              body += '\n### Python Scanner Error\nReview the pip-audit-report artifact; one or more exact pins could not be audited.\n';
            }
            body += '\n---\n*Automated by weekly-security-scan*';

            const labels = ['security-scan', 'automated'];
            if (hasCritical) labels.push('critical');

            if (rolling) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: rolling.number,
                body,
                state: 'open',
                labels,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title, body, labels,
              });
            }
