name: Workflow Governance Audit

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit-workflows:
    name: Scan GitHub workflows for governance risks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Run workflow audit
        id: audit
        run: |
          python scripts/workflow_audit.py \
            --workspace . \
            --report .github/workflows/workflow-audit-report.json \
            --summary .github/workflows/workflow-audit-summary.md

      - name: Upload workflow audit report
        uses: actions/upload-artifact@v7
        with:
          name: workflow-audit-report
          path: |
            .github/workflows/workflow-audit-report.json
            .github/workflows/workflow-audit-summary.md

      - name: Publish audit summary
        if: always()
        run: |
          if [ -f .github/workflows/workflow-audit-summary.md ]; then
            cat .github/workflows/workflow-audit-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Reconcile workflow audit issue
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            const { reconcileRollingIssue } = require('./.github/scripts/issue-lifecycle.cjs');
            const highCount = Number("${{ steps.audit.outputs.high_count }}") || 0;
            const issueCount = Number("${{ steps.audit.outputs.issue_count }}") || 0;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
                "## Workflow Governance Audit",
                "",
                `High-risk findings: **${highCount}**`,
                `All findings: **${issueCount}**`,
                "",
                "Please review and fix masked error patterns before the next release gate.",
                "",
                `Latest run: ${runUrl}`,
                "Artifact: `workflow-audit-report`",
                "",
                "*Automated by workflow-audit.*",
              ].join("\n");
            await reconcileRollingIssue({
              github,
              context,
              key: 'workflow-audit',
              label: 'ci',
              title: 'Workflow Governance Audit - action required',
              active: highCount > 0,
              body,
              labels: ['automation', 'automated', 'security', 'action-needed'],
              legacyTitlePrefixes: ['Workflow Audit:'],
            });
