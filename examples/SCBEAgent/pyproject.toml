
[build-system]
requires = ["setuptools>=84.1.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "SCBEAgent"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "bedrock-agentcore>=1.18.1",
    "certifi>=2026.10.23",
    "mcp >= 1.30.0, < 2.0.0",
    "numpy>=2.4.6",
    "opentelemetry-api>=1.45.1",
    "pygments>=2.20.0",
    "pytest>=9.0.3",
    "pytest-asyncio >= 0.21.0",
    "python-dotenv>=1.2.2",
    "strands-agents >= 1.48.0",
    "urllib3>=2.8.0"
]
